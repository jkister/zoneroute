// /etc/nss-zoneroute.conf
//
// Each { } block lists nameservers (IPv4, up to 3) and the zones they
// answer for.  Lookups in a block's zones go only to that block's
// nameservers; everything else is left to the next NSS service (dns).
// Changes take effect on the next lookup.
//
// When zones in different blocks match a name, the longest (most
// specific) zone wins.  If the same zone is in two blocks, the first
// one wins -- blocks are not fallbacks for each other, so put backup
// servers in the same block.
//
// List zones exactly as the server serves them: some servers (tinydns)
// silently ignore queries outside their zones, which shows up as a
// timeout on every lookup instead of a quick "not found".
//
// # and // start comments.

{
    // LAN reverse lookups, answered by the internal authoritative server
    nameserver 192.168.1.53
    nameserver 192.0.2.53          # off-site secondary

    zone 0.168.192.in-addr.arpa
    zone 1.168.192.in-addr.arpa
    zone 2.168.192.in-addr.arpa
    zone 3.168.192.in-addr.arpa
},
{
    // internal-only names
    nameserver 192.168.1.53

    zone corp.example.com
},
{
    // a lab subdomain with its own servers; wins over corp.example.com
    // for host.lab.corp.example.com because it is more specific
    nameserver 198.51.100.10
    nameserver 198.51.100.11

    zone lab.corp.example.com
    zone 10.in-addr.arpa
}

// Lines outside any block form one more block, so the flat style
// works too:
//
// nameserver 192.168.1.53
// zone 2.168.192.in-addr.arpa
